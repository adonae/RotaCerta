<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <title>Rota do entregador · RotaCerta</title>
  <meta name="theme-color" content="#0b1220">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23f0522b'/%3E%3Cpath d='M8 24c8 0 10-16 16-16' fill='none' stroke='white' stroke-width='2.5' stroke-linecap='round'/%3E%3Ccircle cx='8' cy='24' r='2.5' fill='white'/%3E%3Ccircle cx='24' cy='8' r='2.5' fill='white'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/assets/app.css">
  <script type="module" src="/assets/rota.js"></script>
</head>
<body class="rider-body">
  <div class="rider" id="rider-root">
    <header class="rider-hero">
      <div class="rider-hero__top">
        <span class="brand brand--light">
          <span class="brand__mark">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
              <path d="M5 19c6 0 8-14 14-14"/><circle cx="5" cy="19" r="2.2" fill="currentColor" stroke="none"/><circle cx="19" cy="5" r="2.2" fill="currentColor" stroke="none"/>
            </svg>
          </span>
          <span>
            <span class="brand__name">RotaCerta</span>
            <span class="brand__tag">rota do entregador</span>
          </span>
        </span>
      </div>
      <h1>Carregando rota…</h1>
      <p class="rider-hero__sub">Buscando as entregas no servidor.</p>
    </header>
    <div class="rider-content">
      <div class="empty">
        <div class="empty__icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M5 19c6 0 8-14 14-14"/><circle cx="5" cy="19" r="2.2" fill="currentColor" stroke="none"/><circle cx="19" cy="5" r="2.2" fill="currentColor" stroke="none"/>
          </svg>
        </div>
        <h3>Preparando sua rota…</h3>
        <p>Isso leva só um instante.</p>
      </div>
    </div>
  </div>

  <div class="toasts" id="toasts" aria-live="polite"></div>

  <noscript>
    <p style="padding:24px;text-align:center">Ative o JavaScript para abrir a rota.</p>
  </noscript>
</body>
</html>
